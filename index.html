<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>李清槊 · 拾陆志喜</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;600&family=Cinzel:wght@400;700&display=swap');

        :root {
            --gold: #c9a84c;
            --gold-glow: rgba(201, 168, 76, 0.5);
            --ink: #e8e4dc;
            --bg-dark: #05070a;
            --bg-warm: #0c1018;
            --wax-base: #f5efe6;
            --wax-shadow: #d4cabb;
            --wax-highlight: #fffdf8;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; height: 100%; overflow: hidden; touch-action: none; overscroll-behavior: none; }

        body {
            background: var(--bg-dark);
            font-family: 'Noto Serif SC', serif;
            color: var(--ink);
            transition: background 2s ease;
            padding-top: var(--safe-top);
            padding-bottom: var(--safe-bottom);
        }
        body.warmed { background: var(--bg-warm); }

        /* === 蜡烛仪式层 === */
        #ceremony-layer {
            position: fixed; inset: 0; z-index: 100;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            transition: opacity 1.2s ease, visibility 1.2s;
        }
        #ceremony-layer.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

        .cake-tray {
            position: relative;
            display: flex; justify-content: center; align-items: flex-end;
            flex-wrap: wrap;
            width: min(92vw, 380px);
            gap: clamp(5px, 2vw, 10px);
            padding-bottom: 28px;
        }
        /* 托盘反光 */
        .cake-tray::after {
            content: ''; position: absolute; bottom: 0; left: 50%;
            transform: translateX(-50%);
            width: 115%; height: 16px;
            background: radial-gradient(ellipse, rgba(201,168,76,0.1) 0%, transparent 70%);
            border-radius: 50%;
        }

        /* === 高质感蜡烛本体 === */
        .candle {
            position: relative;
            width: clamp(10px, 2.8vw, 14px);
            height: clamp(40px, 9vw, 56px);
            border-radius: 3px 3px 1px 1px;
            flex-shrink: 0;
            /* 5层渐变模拟圆柱体光影 */
            background: linear-gradient(90deg, 
                var(--wax-shadow) 0%, 
                var(--wax-base) 25%, 
                var(--wax-highlight) 45%, 
                var(--wax-base) 65%, 
                var(--wax-shadow) 100%
            );
            /* 内阴影增强立体感 */
            box-shadow: inset -1px 0 2px rgba(0,0,0,0.08), inset 1px 0 1px rgba(255,255,255,0.3);
        }

        /* 顶部蜡油凹陷 */
        .candle::before {
            content: ''; position: absolute; top: -1px; left: 0; right: 0; height: 4px;
            background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0.06) 30%, transparent 70%);
            border-radius: 50%;
        }

        /* 烛芯 */
        .candle::after {
            content: ''; position: absolute; top: -5px; left: 50%;
            transform: translateX(-50%);
            width: 1.5px; height: 5px;
            background: linear-gradient(to top, #3a3020, #1a1510);
            border-radius: 1px;
        }

        /* === 第16根特殊蜡烛 === */
        .candle.sixteenth {
            height: clamp(56px, 12vw, 72px);
            width: clamp(14px, 3.5vw, 18px);
            background: linear-gradient(90deg, 
                #b8942e 0%, #e8d080 25%, #fff8e0 45%, #e8d080 65%, #b8942e 100%
            );
            box-shadow: inset -1px 0 3px rgba(120,80,0,0.15), inset 1px 0 2px rgba(255,255,255,0.4), 0 0 15px rgba(201,168,76,0.2);
            cursor: pointer; z-index: 2; order: 16;
        }
        /* 扩大触摸热区至44px */
        .candle.sixteenth::before {
            content: ''; position: absolute;
            top: -25px; left: 50%; bottom: -10px;
            transform: translateX(-50%);
            width: 44px; height: calc(100% + 35px);
            background: transparent;
        }
        .candle.sixteenth::after {
            height: 6px; width: 2px;
            background: linear-gradient(to top, #4a3a10, #2a1a00);
        }

        /* === 真实感火焰 === */
        .flame-wrapper {
            position: absolute; top: -22px; left: 50%;
            transform: translateX(-50%) scale(0);
            opacity: 0; pointer-events: none;
            transition: opacity 0.25s ease, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .flame-wrapper.lit {
            opacity: 1; transform: translateX(-50%) scale(1);
            animation: flicker 0.12s ease-in-out infinite alternate;
        }

        /* 火焰三层结构 */
        .flame-core {
            width: 8px; height: 14px;
            background: radial-gradient(ellipse at 50% 85%, #fff 0%, #ffe8a0 30%, #ffaa33 60%, rgba(255,80,20,0.7) 85%, transparent 100%);
            border-radius: 50% 50% 50% 50% / 65% 65% 35% 35%;
            filter: blur(0.5px);
        }
        .flame-glow {
            position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
            width: 24px; height: 24px;
            background: radial-gradient(circle, rgba(255,170,50,0.25) 0%, transparent 70%);
            border-radius: 50%;
        }

        /* 第16根火焰更大更亮 */
        .candle.sixteenth .flame-wrapper.lit .flame-core {
            width: 12px; height: 20px;
            filter: blur(0.3px) brightness(1.15);
        }
        .candle.sixteenth .flame-wrapper.lit .flame-glow {
            width: 40px; height: 40px; top: -10px;
            background: radial-gradient(circle, rgba(255,170,50,0.35) 0%, transparent 70%);
        }

        @keyframes flicker {
            0% { transform: translateX(-50%) scale(1) rotate(-1deg) scaleY(1); }
            25% { transform: translateX(-50%) scale(1.02) rotate(0.5deg) scaleY(1.03); }
            50% { transform: translateX(-50%) scale(0.98) rotate(-0.5deg) scaleY(0.97); }
            75% { transform: translateX(-50%) scale(1.01) rotate(0.8deg) scaleY(1.02); }
            100% { transform: translateX(-50%) scale(1) rotate(1deg) scaleY(1); }
        }

        /* 点燃火花 */
        .spark {
            position: absolute; width: 2px; height: 2px;
            background: #ffe0a0; border-radius: 50%; pointer-events: none;
        }

        .hint {
            margin-top: 45px; font-size: 13px; letter-spacing: 5px;
            color: rgba(255,255,255,0.3); text-align: center;
            animation: pulse 2.5s ease-in-out infinite;
        }
        @keyframes pulse { 0%,100% { opacity: 0.15; } 50% { opacity: 0.55; } }

        /* 暖光脉冲 */
        .warm-pulse {
            position: fixed; inset: 0; pointer-events: none; z-index: 99;
            background: radial-gradient(circle at 50% 55%, rgba(255,170,50,0.15) 0%, transparent 60%);
            opacity: 0;
        }
        .warm-pulse.active { animation: warmPulseAnim 1.6s ease-out forwards; }
        @keyframes warmPulseAnim { 0% { opacity: 0; transform: scale(0.6); } 30% { opacity: 1; } 100% { opacity: 0; transform: scale(1.6); } }

        /* === 贺卡主体 === */
        #card {
            position: relative; z-index: 10;
            width: 90%; max-width: 540px; margin: auto;
            padding: calc(40px + var(--safe-top)) 32px calc(40px + var(--safe-bottom));
            opacity: 0; transform: translateY(25px) scale(0.96);
            transition: opacity 1.2s ease, transform 1.2s cubic-bezier(0.22,1,0.36,1);
        }
        #card.revealed { opacity: 1; transform: translateY(0) scale(1); }

        .frame-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
        .frame-path { fill: none; stroke: var(--gold); stroke-width: 0.8; opacity: 0.4; stroke-dasharray: 2000; stroke-dashoffset: 2000; transition: stroke-dashoffset 2.2s ease 0.3s; }
        #card.revealed .frame-path { stroke-dashoffset: 0; }

        .date-line { font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 7px; color: var(--gold); text-align: center; margin-bottom: 8px; opacity: 0; transition: opacity 0.8s ease 0.6s; }
        .name-title { text-align: center; font-size: clamp(26px, 8vw, 40px); font-weight: 600; color: var(--gold); line-height: 1.4; margin-bottom: 6px; opacity: 0; transform: translateY(10px); transition: all 0.8s ease 0.8s; text-shadow: 0 0 18px var(--gold-glow); }
        .subtitle { text-align: center; font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 9px; color: rgba(201,168,76,0.6); margin-bottom: 36px; opacity: 0; transition: opacity 0.8s ease 1s; }
        #card.revealed .date-line, #card.revealed .name-title, #card.revealed .subtitle { opacity: 1; transform: translateY(0); }

        .body-text { font-size: clamp(14px, 3.8vw, 16px); line-height: 2.3; color: rgba(232,228,220,0.88); min-height: 160px; letter-spacing: 0.3px; }
        .body-text .char { display: inline; opacity: 0; animation: charIn 0.2s ease forwards; }
        @keyframes charIn { to { opacity: 1; } }

        .signature { text-align: right; margin-top: 40px; opacity: 0; transform: translateX(8px); transition: all 0.8s ease; }
        .sig-name { font-size: clamp(18px, 5vw, 22px); color: var(--gold); font-weight: 600; }
        .sig-date { font-size: 11px; color: rgba(255,255,255,0.3); letter-spacing: 2px; margin-top: 4px; }

        .shimmer-overlay { position: fixed; inset: 0; background: linear-gradient(105deg, transparent 40%, rgba(201,168,76,0.06) 45%, rgba(201,168,76,0.1) 50%, rgba(201,168,76,0.06) 55%, transparent 60%); z-index: 50; pointer-events: none; left: -100%; }
        .shimmer-overlay.active { animation: shimmerSweep 1.6s ease-in-out; }
        @keyframes shimmerSweep { to { left: 100%; } }

        .music-toggle { position: fixed; bottom: calc(24px + var(--safe-bottom)); right: 24px; width: 40px; height: 40px; border: 1px solid rgba(201,168,76,0.25); border-radius: 50%; display: flex; align-items: center; justify-content: center; gap: 2px; z-index: 200; opacity: 0; transition: opacity 0.8s ease 1.8s, border-color 0.3s; cursor: pointer; }
        .m-bar { width: 2px; background: var(--gold); animation: mSound 0.8s ease-in-out infinite alternate; }
        .m-bar:nth-child(1) { height: 8px; } .m-bar:nth-child(2) { height: 14px; animation-delay: 0.15s; } .m-bar:nth-child(3) { height: 6px; animation-delay: 0.3s; }
        .music-toggle.paused .m-bar { animation-play-state: paused; height: 2px !important; }
        @keyframes mSound { to { height: 16px; } }
    </style>
</head>
<body>

    <div id="ceremony-layer">
        <div class="cake-tray" id="cake-tray"></div>
        <div class="hint" id="hint">点 亮 第 十 六 根 蜡 烛</div>
    </div>

    <div class="warm-pulse" id="warm-pulse"></div>
    <div class="shimmer-overlay" id="shimmer"></div>

    <div id="card">
        <svg class="frame-svg" viewBox="0 0 540 700" preserveAspectRatio="none"><path class="frame-path" d="M18,8 Q26,2 38,6 L502,4 Q518,2 524,12 L530,680 Q532,694 518,696 L28,698 Q12,697 10,682 Z" /></svg>
        <div class="date-line">AUGUST · XIII · MMXXVI</div>
        <h1 class="name-title">李清槊</h1>
        <div class="subtitle">SWEET SIXTEEN</div>
        <div class="body-text" id="body-text"></div>
        <div class="signature" id="signature">
            <div class="sig-name">孙勤和 贺</div>
            <div class="sig-date">二〇二六年八月十三日</div>
        </div>
    </div>

    <div class="music-toggle" id="music-btn"><div class="m-bar"></div><div class="m-bar"></div><div class="m-bar"></div></div>

<script>
const MESSAGE = `清槊：\n\n见字如晤。\n\n十六岁，是少年与青年的分水岭。愿你自此以后，有长风破浪的锐气，亦有润物无声的从容。\n\n世界很大，但属于你的星辰正次第亮起。不必追赶谁的脚步，你自有你的节奏与光芒。\n\n生日快乐，我的挚友。愿这第十六个秋天，成为你辽阔人生的序章。`;

/* ========== 生成16根高质感蜡烛 ========== */
const tray = document.getElementById('cake-tray');
const candles = [];
const flames = [];

for (let i = 0; i < 16; i++) {
    const candle = document.createElement('div');
    candle.className = i === 15 ? 'candle sixteenth' : 'candle';
    
    // 火焰容器（独立于蜡烛本体，避免transform冲突）
    const flameWrapper = document.createElement('div');
    flameWrapper.className = 'flame-wrapper';
    flameWrapper.innerHTML = '<div class="flame-glow"></div><div class="flame-core"></div>';
    candle.appendChild(flameWrapper);
    
    candles.push(candle);
    flames.push(flameWrapper);
    tray.appendChild(candle);
}

/* ========== 火花粒子 ========== */
function createSparks(el) {
    const rect = el.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top - 5;
    for (let i = 0; i < 6; i++) {
        const spark = document.createElement('div');
        spark.className = 'spark';
        spark.style.left = cx + 'px'; spark.style.top = cy + 'px';
        document.body.appendChild(spark);
        const angle = -Math.PI/2 + (Math.random()-0.5)*Math.PI*0.8;
        const dist = 15 + Math.random()*20;
        spark.animate([
            { transform: 'translate(0,0) scale(1)', opacity: 1 },
            { transform: `translate(${Math.cos(angle)*dist}px,${Math.sin(angle)*dist}px) scale(0)`, opacity: 0 }
        ], { duration: 350+Math.random()*200, easing: 'ease-out', fill: 'forwards' })
        .onfinish = () => spark.remove();
    }
}

/* ========== 点燃逻辑 ========== */
function lightCandle(index) {
    flames[index].classList.add('lit');
    createSparks(candles[index]);
}

let triggered = false;
function triggerCeremony(e) {
    if (e) e.preventDefault();
    if (triggered) return;
    triggered = true;
    
    document.getElementById('hint').style.opacity = '0';
    
    // 前15根波浪式自动点燃
    for (let i = 0; i < 15; i++) {
        setTimeout(() => lightCandle(i), i * 110);
    }
    
    // 第16根最后点燃
    setTimeout(() => {
        lightCandle(15);
        document.getElementById('warm-pulse').classList.add('active');
        document.body.classList.add('warmed');
        
        setTimeout(() => {
            document.getElementById('ceremony-layer').classList.add('hidden');
            document.getElementById('card').classList.add('revealed');
            document.getElementById('shimmer').classList.add('active');
            document.getElementById('music-btn').style.opacity = '1';
            setTimeout(startTypewriter, 1000);
        }, 900);
    }, 15 * 110 + 250);
}

// 绑定事件（仅第16根）
candles[15].addEventListener('click', triggerCeremony);
candles[15].addEventListener('touchend', triggerCeremony);

/* ========== 快速打字机 ========== */
function startTypewriter() {
    const container = document.getElementById('body-text');
    const chars = MESSAGE.split('');
    let idx = 0;
    const SPEED = 35;
    function next() {
        if (idx >= chars.length) {
            setTimeout(() => { const s = document.getElementById('signature'); s.style.opacity='1'; s.style.transform='translateX(0)'; }, 350);
            return;
        }
        const ch = chars[idx];
        if (ch==='\n') container.appendChild(document.createElement('br'));
        else { const span=document.createElement('span'); span.className='char'; span.textContent=ch; container.appendChild(span); }
        idx++;
        setTimeout(next, ['，','。','！','？'].includes(ch)?SPEED*3:ch==='\n'?SPEED*2:SPEED);
    }
    next();
}

/* ========== 音乐按钮 ========== */
const musicBtn = document.getElementById('music-btn');
let playing = true;
musicBtn.addEventListener('click', () => { playing=!playing; musicBtn.classList.toggle('paused',!playing); });
</script>
</body>
</html>
